<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>You're Offline — ALFIJEER</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<meta name="theme-color" content="#001233"/>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --gold: #FFBE1A; --gold-light: #FFCF4D;
    --navy-deep: #001233; --on-navy: #FFFFFF; --on-navy-dim: rgba(255,255,255,0.72);
  }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', sans-serif;
    background: var(--navy-deep); color: var(--on-navy);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .wrap { max-width: 420px; }
  .glyph { font-size: 3.4rem; margin-bottom: 14px; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  h1 { font-family: 'Cinzel', serif; font-size: 1.2rem; margin-bottom: 10px; }
  p { color: var(--on-navy-dim); font-size: 0.88rem; line-height: 1.7; margin-bottom: 26px; }
  button {
    background: var(--gold); color: var(--navy-deep); border: none;
    padding: 12px 26px; border-radius: 10px; font-weight: 800; font-size: 0.85rem;
    cursor: pointer; font-family: 'Nunito', sans-serif;
  }
  button:hover { background: var(--gold-light); }
  .status { margin-top: 18px; font-size: 0.75rem; color: var(--on-navy-dim); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #e74c3c; margin-right: 6px; }
  .dot.online { background: #4ADE80; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glyph">📡</div>
    <h1>You're offline</h1>
    <p>ALFIJEER needs an internet connection to load shops, products, and directions. Check your connection and try again — any pages you've already visited may still work from cache.</p>
    <button onclick="location.reload()">↻ Try Again</button>
    <div class="status"><span class="dot" id="status-dot"></span><span id="status-text">Checking connection…</span></div>
  </div>
  <script>
    function updateStatus() {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      if (navigator.onLine) {
        dot.classList.add('online');
        text.textContent = 'Back online — tap Try Again';
      } else {
        dot.classList.remove('online');
        text.textContent = 'Still offline';
      }
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
