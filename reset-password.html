<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — ALFIJEER</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="manifest" href="./manifest.json"/>
<meta name="theme-color" content="#001233"/>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --gold: #FFBE1A; --gold-light: #FFCF4D; --gold-dim: #C99000;
    --navy-deep: #001233; --navy-mid: #001E4D;
    --on-navy: #FFFFFF; --on-navy-dim: rgba(255,255,255,0.72);
    --white: #14203A; --white-dim: #5C6B85; --border: rgba(201,144,0,0.2);
  }
  body {
    font-family: 'Nunito', sans-serif; background: var(--navy-deep); color: var(--on-navy);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: var(--navy-mid); border: 1px solid rgba(255,190,26,0.18); border-radius: 16px;
    padding: 32px 28px; max-width: 380px; width: 100%;
  }
  .card .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; justify-content: center; }
  .card .logo img { height: 36px; width: 36px; border-radius: 36px; }
  .card .logo span { font-family: 'Cinzel', serif; font-weight: 700; font-size: 0.9rem; color: var(--gold); letter-spacing: 1.5px; }
  h1 { font-family: 'Cinzel', serif; font-size: 1.2rem; text-align: center; margin-bottom: 8px; }
  p.sub { text-align: center; color: var(--on-navy-dim); font-size: 0.85rem; margin-bottom: 24px; line-height: 1.6; }
  label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--on-navy-dim); margin-bottom: 6px; }
  .form-group { margin-bottom: 16px; }
  input {
    width: 100%; padding: 11px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: var(--on-navy); font-family: 'Nunito', sans-serif; font-size: 0.88rem;
  }
  input:focus { outline: none; border-color: var(--gold); }
  button {
    width: 100%; padding: 13px; border-radius: 10px; border: none; background: var(--gold);
    color: var(--navy-deep); font-weight: 800; font-size: 0.9rem; cursor: pointer; font-family: 'Nunito', sans-serif;
    margin-top: 6px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button:hover:not(:disabled) { background: var(--gold-light); }
  .back-link { display: block; text-align: center; margin-top: 18px; font-size: 0.8rem; color: var(--on-navy-dim); text-decoration: none; }
  .back-link:hover { color: var(--gold); }
  .invalid-state { text-align: center; }
  .invalid-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
  .success-state { display: none; text-align: center; }
  .success-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #fff; color: var(--white); padding: 12px 20px; border-radius: 8px;
    font-size: 0.85rem; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none; transition: opacity 0.3s; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <img src="./Alfijeer1.png" alt="" onerror="this.style.display='none'"/>
      <span>ALFIJEER</span>
    </div>

    <div id="form-state">
      <h1>Set a New Password</h1>
      <p class="sub">Choose a new password for your account below.</p>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="new-password" placeholder="At least 6 characters"/>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirm-password" placeholder="Re-type your new password"/>
      </div>
      <button id="submit-btn" onclick="submitReset()">Update Password</button>
    </div>

    <div id="invalid-state" class="invalid-state" style="display:none;">
      <div class="icon">⚠️</div>
      <h1>Link Missing Information</h1>
      <p class="sub">This reset link looks incomplete. Please request a new one from the login page.</p>
      <a href="auth.html" class="back-link">← Back to Login</a>
    </div>

    <div id="success-state" class="success-state">
      <div class="icon">✅</div>
      <h1>Password Updated</h1>
      <p class="sub">You can now log in with your new password.</p>
      <button onclick="window.location.href='auth.html'">Go to Login</button>
    </div>

    <a href="auth.html" class="back-link" id="back-link-normal">← Back to Login</a>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const _API = 'https://arewa-square-backend-production.up.railway.app/api';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    if (!token || !email) {
      document.getElementById('form-state').style.display = 'none';
      document.getElementById('back-link-normal').style.display = 'none';
      document.getElementById('invalid-state').style.display = 'block';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    async function submitReset() {
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword.length < 6) { showToast('Password must be at least 6 characters.'); return; }
      if (newPassword !== confirmPassword) { showToast("Passwords don't match."); return; }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Updating…';

      try {
        const res = await fetch(_API + '/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, newPassword }),
        });
        const data = await res.json();
        if (!res.ok) {
          showToast(data.message || 'Something went wrong.');
          btn.disabled = false;
          btn.textContent = 'Update Password';
          return;
        }
        document.getElementById('form-state').style.display = 'none';
        document.getElementById('back-link-normal').style.display = 'none';
        document.getElementById('success-state').style.display = 'block';
      } catch (e) {
        showToast('Connection error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    }
  </script>
</body>
</html>
